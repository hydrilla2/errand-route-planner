<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Errand Route Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>

<body>
  <h1>Errand Route Planner</h1>
  <button id="planBtn">Plan route</button>
  <div id="results"></div>

  <h2>Stops</h2>
  <input id="addressInput" placeholder="Search address">
  <button id="searchBtn">Search</button>
  <ul id="stopList"></ul>

  <fieldset>
    <legend>Route end</legend>
    <label><input type="radio" name="endMode" value="roundtrip" checked> Return to start</label>
    <label><input type="radio" name="endMode" value="anywhere"> End anywhere</label>
    <label><input type="radio" name="endMode" value="fixed"> End at:
      <select id="destinationSelect" disabled></select>
    </label>
  </fieldset>

  <h2>Map</h2>
  <div id="map" style="height: 400px;"></div>




  <script>
    const API = "http://127.0.0.1:8000";

    const stops = [];


    async function planRoute() {
      try {
        const endMode = document.querySelector('input[name="endMode"]:checked').value;
        const roundTrip = endMode === "roundtrip";
        const endIndex = endMode === "fixed" ? parseInt(document.getElementById("destinationSelect").value, 10) : null;

        // 1. send a POST to API + "/optimize"
        const res = await fetch(API + "/optimize", {
          method: "POST",
          headers: { "Content-Type": "application/json" },

          body: JSON.stringify({ stops, round_trip: roundTrip, end_index: endIndex })

        });

        // 2. body is JSON: { stops, round_trip: true }
        if (!res.ok) {
          throw new Error(`Server returned ${res.status}`);
        }

        // 3. read the JSON response
        const data = await res.json();

        renderResults(data);


      } catch (err) {
        document.getElementById("results").innerHTML = `<p style="color:red">Error: ${err.message}</p>`;
      }

    }

    const map = L.map('map').setView([3.1390, 101.6869], 12); // KL, zoom 12

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    map.on('click', async (e) => {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      let name = `Stop (${lat.toFixed(4)}, ${lng.toFixed(4)})`; // fallback if reverse geocoding fails

      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.display_name) {
          name = data.display_name;
        }
      } catch (err) {
        // network error — keep the coordinate-based fallback name
      }

      stops.push({ name, lat, lng });
      renderStops();
      map.setView([lat, lng], map.getZoom());
    });


    let markers = [];

    function renderStops() {
      const list = document.getElementById("stopList");
      list.innerHTML = "";

      markers.forEach(m => map.removeLayer(m));
      markers = [];

      stops.forEach((stop, index) => {
        const li = document.createElement("li");
        li.textContent = `${stop.name} (${stop.lat}, ${stop.lng}) `;

        const removeBtn = document.createElement("button");
        removeBtn.textContent = "Remove";
        removeBtn.addEventListener("click", () => {
          stops.splice(index, 1);

          renderStops();
        });

        li.appendChild(removeBtn);
        list.appendChild(li);

        const marker = L.marker([stop.lat, stop.lng]).addTo(map).bindPopup(stop.name);
        markers.push(marker);
      });
      renderDestinationOptions();
    }

    function renderResults(data) {
      const results = document.getElementById("results");

      const orderedNames = data.order.map(i => stops[i].name);
      const mapsLink = buildGoogleMapsLink(data);

      results.innerHTML = `
    <h3>Optimised order</h3>
    <ol>${orderedNames.map(name => `<li>${name}</li>`).join("")}</ol>
    <p>Optimised duration: ${data.optimisedDistance} min</p>
    <p>Naive duration: ${data.naiveDistance} min</p>
    <p>Source: ${data.distanceSource}</p>
    <p><a href="${mapsLink}" target="_blank">Open in Google Maps</a></p>


    `;
    }

    function buildGoogleMapsLink(data) {
      const orderedStops = data.order.map(i => stops[i]);

      const origin = orderedStops[0];
      let destination = orderedStops[orderedStops.length - 1];
      let middle = orderedStops.slice(1, -1);

      if (data.roundTrip) {
        middle = orderedStops.slice(1);
        destination = origin;
      }

      const originStr = `${origin.lat},${origin.lng}`;
      const destinationStr = `${destination.lat},${destination.lng}`;
      const waypointsStr = middle.map(s => `${s.lat},${s.lng}`).join("|");

      let url = `https://www.google.com/maps/dir/?api=1&origin=${originStr}&destination=${destinationStr}&travelmode=driving`;
      if (waypointsStr) {
        url += `&waypoints=${encodeURIComponent(waypointsStr)}`;
      }
      return url;
    }


    function renderDestinationOptions() {
      const select = document.getElementById("destinationSelect");
      const previousValue = select.value;
      select.innerHTML = "";

      stops.forEach((stop, index) => {
        if (index === 0) return; // can't be your own destination
        const option = document.createElement("option");
        option.value = index;
        option.textContent = stop.name;
        select.appendChild(option);
      });

      if ([...select.options].some(o => o.value === previousValue)) {
        select.value = previousValue;
      }
    }

    document.querySelectorAll('input[name="endMode"]').forEach(radio => {
      radio.addEventListener("change", () => {
        document.getElementById("destinationSelect").disabled =
          document.querySelector('input[name="endMode"]:checked').value !== "fixed";
      });
    });



    document.getElementById("searchBtn").addEventListener("click", async () => {
      const query = document.getElementById("addressInput").value;
      if (!query) return;

      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
      const res = await fetch(url);
      const results = await res.json();

      if (results.length === 0) {
        alert("No results found.");
        return;
      }

      const { lat, lon, display_name } = results[0];
      stops.push({ name: display_name, lat: parseFloat(lat), lng: parseFloat(lon) });
      renderStops();
      map.setView([lat, lon], 14);

      document.getElementById("addressInput").value = "";
    });



    document.getElementById("planBtn").addEventListener("click", planRoute);

    renderStops();
  </script>
</body>

</html>
